<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>證據時間軸製作器</title>
  <style>
    :root {
      --paper: #f6f1e7;
      --paper-deep: #e9dfcd;
      --ink: #17263b;
      --ink-soft: #516070;
      --line: #c9bda8;
      --blue: #274c77;
      --red: #a5483f;
      --green: #3d6b57;
      --amber: #a46f22;
      --violet: #725982;
      --shadow: 0 18px 48px rgba(0, 0, 0, .12);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; overflow-x: hidden; }

    body {
      margin: 0;
      color: var(--ink);
      background: #dcd3c4;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    button, input, textarea, select { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    :focus-visible {
      outline: 3px solid rgba(39, 76, 119, .38);
      outline-offset: 3px;
    }

    ::placeholder { color: #66717d; opacity: 1; }

    ::selection { background: #cfad72; color: #101b2a; }

    .app-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto 64px;
      background: var(--paper);
      box-shadow: var(--shadow);
      min-height: calc(100vh - 56px);
    }

    .masthead {
      padding: 42px 52px 34px;
      color: #f8f2e9;
      background: var(--ink);
      position: relative;
      overflow: hidden;
    }

    .masthead::after {
      content: "EVIDENCE / CHRONOLOGY";
      position: absolute;
      right: 38px;
      bottom: 12px;
      color: rgba(255,255,255,.05);
      font: 700 clamp(26px, 5vw, 68px)/1 Georgia, serif;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .masthead h1 {
      margin: 0;
      max-width: 760px;
      font: 700 clamp(30px, 5vw, 56px)/1.15 Georgia, "Noto Serif TC", serif;
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    .subtitle {
      margin: 14px 0 0;
      color: #cfd7df;
      max-width: 700px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 52px;
      background: #fffaf1;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .toolbar-group { display: flex; flex-wrap: wrap; gap: 10px; }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      color: var(--ink);
      background: var(--paper-deep);
      font-weight: 700;
      transition: transform .16s ease-out, background .16s ease-out;
    }

    .btn:hover { background: #ded2bd; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { color: #fff; background: var(--blue); }
    .btn-primary:hover { background: #1e3c60; }
    .btn-danger { color: var(--red); background: transparent; padding-inline: 8px; }
    .btn-danger:hover { background: #f0ded9; }
    .btn svg { width: 18px; height: 18px; }

    .privacy-note {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
    }

    .privacy-note svg { width: 18px; height: 18px; }

    main { padding: 38px 52px 72px; }

    .document-settings {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(150px, .5fr);
      gap: 18px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--line);
    }

    label { display: block; color: var(--ink-soft); font-size: 13px; font-weight: 700; }

    .field {
      width: 100%;
      margin-top: 7px;
      padding: 11px 12px;
      color: var(--ink);
      background: rgba(255,255,255,.66);
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    textarea.field { resize: vertical; min-height: 78px; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin: 28px 0 46px;
      border-block: 1px solid var(--line);
    }

    .summary-item { padding: 17px 16px; border-right: 1px solid var(--line); }
    .summary-item:last-child { border-right: 0; }
    .summary-value { display: block; font: 700 25px/1.2 Georgia, serif; font-variant-numeric: tabular-nums; }
    .summary-label { display: block; margin-top: 5px; color: var(--ink-soft); font-size: 13px; }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      margin-bottom: 28px;
    }

    .section-heading h2 { margin: 0; font: 700 clamp(26px, 4vw, 40px)/1.2 Georgia, "Noto Serif TC", serif; }
    .section-heading p { margin: 0; color: var(--ink-soft); font-size: 13px; }

    .timeline { position: relative; }

    .timeline::before {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 116px;
      width: 1px;
      background: var(--line);
    }

    .event {
      --accent: var(--blue);
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 46px;
      position: relative;
      margin-bottom: 22px;
    }

    .event::before {
      content: "";
      position: absolute;
      left: 110px;
      top: 27px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--paper);
      border: 3px solid var(--accent);
      z-index: 2;
    }

    .event[data-kind="withdrawal"] { --accent: var(--red); }
    .event[data-kind="transfer"] { --accent: var(--violet); }
    .event[data-kind="conversation"] { --accent: var(--green); }
    .event[data-kind="rebate"] { --accent: var(--amber); }
    .event[data-kind="adjustment"] { --accent: #67737e; }
    .event[data-kind="cash"] { --accent: #8c6239; }

    .event-date { padding-top: 15px; text-align: right; font-variant-numeric: tabular-nums; }
    .event-date strong { display: block; font: 700 21px/1.1 Georgia, serif; }
    .event-date span { display: block; margin-top: 7px; color: var(--ink-soft); font-size: 13px; line-height: 1.3; }

    .event-card {
      background: rgba(255,255,255,.58);
      border-radius: var(--radius);
      box-shadow: 0 5px 20px rgba(23, 38, 59, .07);
      overflow: hidden;
    }

    .event-card[open] { box-shadow: 0 14px 34px rgba(23, 38, 59, .1); }

    .event-summary {
      list-style: none;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      padding: 18px 20px;
      cursor: pointer;
    }

    .event-summary::-webkit-details-marker { display: none; }

    .kind-mark {
      width: 8px;
      height: 42px;
      background: var(--accent);
      border-radius: 5px;
    }

    .event-title { min-width: 0; }
    .event-title strong { display: block; font-size: 16px; }
    .event-meta { margin-top: 3px; color: var(--ink-soft); font-size: 13px; }

    .evidence-count {
      white-space: nowrap;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 700;
    }

    .event-card[open] .evidence-count { color: var(--accent); }

    .event-body {
      padding: 5px 20px 22px 41px;
      border-top: 1px solid rgba(201, 189, 168, .65);
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 12px;
      padding: 18px 0 8px;
    }

    .edit-grid .wide { grid-column: span 3; }

    .evidence-zone {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px dashed var(--line);
    }

    .evidence-zone-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .evidence-zone-head h3 { margin: 0; font-size: 16px; }
    .file-input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

    .evidence-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .evidence-item { margin: 0; min-width: 0; }

    .evidence-image-wrap {
      min-height: 280px;
      max-height: 520px;
      background: #e4ddcf;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .evidence-image-wrap a { display: block; width: 100%; height: 100%; }
    .evidence-image-wrap img { width: 100%; height: 100%; min-height: 280px; max-height: 520px; display: block; object-fit: contain; background: #efe9de; }

    .evidence-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      color: white;
      background: rgba(23, 38, 59, .84);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .evidence-caption { margin-top: 7px; }
    .empty-evidence { color: var(--ink-soft); font-size: 13px; padding: 6px 0 2px; }

    .status {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 18px);
      padding: 10px 16px;
      color: #fff;
      background: var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease-out, transform .18s ease-out;
      z-index: 50;
    }

    .status.show { opacity: 1; transform: translate(-50%, 0); }

    .print-only { display: none; }

    .mobile-help { display: none; }

    @media (max-width: 760px) {
      body { padding-inline: env(safe-area-inset-left) env(safe-area-inset-right); }
      .app-shell { width: 100%; margin: 0; min-height: 100dvh; }
      .masthead, main { padding-left: 16px; padding-right: 16px; }
      .masthead { padding-top: max(25px, env(safe-area-inset-top)); padding-bottom: 24px; }
      .masthead h1 { max-width: 100%; font-size: 30px; overflow-wrap: anywhere; }
      .masthead::after { display: none; }
      .subtitle { margin-top: 10px; font-size: 13px; overflow-wrap: anywhere; }
      .toolbar {
        position: fixed;
        inset: auto 0 0;
        padding: 10px 16px max(10px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        border-bottom: 0;
        box-shadow: 0 -8px 24px rgba(23, 38, 59, .12);
        align-items: stretch;
      }
      .toolbar-group { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); width: 100%; min-width: 0; }
      .toolbar .btn { min-width: 0; min-height: 48px; padding-inline: 8px; font-size: 13px; white-space: nowrap; }
      .privacy-note { display: none; }
      main { padding-top: 22px; padding-bottom: calc(104px + env(safe-area-inset-bottom)); }
      .mobile-help {
        display: block;
        margin: 0 0 22px;
        padding: 13px 14px;
        color: var(--ink);
        background: #fffaf1;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 14px;
      }
      .mobile-help strong { display: block; margin-bottom: 3px; }
      .document-settings { grid-template-columns: minmax(0, 1fr); }
      .document-settings label { min-width: 0; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-item:nth-child(2) { border-right: 0; }
      .summary-item:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .section-heading { align-items: flex-start; flex-direction: column; }
      .timeline::before { left: 11px; }
      .event { grid-template-columns: 1fr; gap: 8px; padding-left: 26px; }
      .event::before { left: 4px; top: 12px; }
      .event-date { text-align: left; padding-top: 0; display: flex; gap: 8px; align-items: baseline; }
      .event-date span { margin-top: 0; }
      .event-summary { grid-template-columns: auto minmax(0, 1fr); padding: 15px 13px; min-height: 72px; }
      .event-title, .event-title strong, .event-meta { overflow-wrap: anywhere; }
      .evidence-count { grid-column: 2; }
      .event-body { padding: 3px 13px 18px; }
      .edit-grid { grid-template-columns: 1fr; }
      .edit-grid .wide { grid-column: auto; }
      .evidence-zone-head { align-items: stretch; flex-direction: column; }
      .upload-label { width: 100%; color: #fff; background: var(--blue); }
      .evidence-list { grid-template-columns: 1fr; }
      .evidence-image-wrap, .evidence-image-wrap img { min-height: 0; max-height: none; }
      .evidence-remove { width: 44px; height: 44px; }
      .status { bottom: calc(82px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 32px); text-align: center; }
    }

    @media print {
      @page { size: A4; margin: 13mm; }
      body { background: #fff; color: #101820; font-size: 10.5pt; }
      .app-shell { width: 100%; margin: 0; box-shadow: none; min-height: auto; background: #fff; }
      .masthead { color: #101820; background: #fff; padding: 0 0 10mm; border-bottom: 2px solid #17263b; }
      .masthead::after, .toolbar, .section-heading p, .edit-grid, .evidence-remove, .file-input, .upload-label { display: none !important; }
      .masthead h1 { font-size: 25pt; }
      .subtitle { color: #46515c; margin-top: 2mm; }
      main { padding: 8mm 0 0; }
      .document-settings { display: none; }
      .summary { margin: 0 0 9mm; }
      .summary-item { padding: 3mm; }
      .summary-value { font-size: 15pt; }
      .section-heading { margin-bottom: 6mm; }
      .section-heading h2 { font-size: 20pt; }
      .print-only { display: block; }
      .print-meta { margin: 0 0 8mm; color: #46515c; }
      .timeline::before { left: 36mm; }
      .event { grid-template-columns: 30mm minmax(0, 1fr); gap: 12mm; margin-bottom: 5mm; break-inside: avoid; }
      .event::before { left: 34.4mm; top: 4.8mm; width: 3mm; height: 3mm; border-width: 1mm; }
      .event-date { padding-top: 3mm; }
      .event-date strong { font-size: 13pt; }
      .event-date span { white-space: nowrap; font-size: 9pt; }
      .event-card, .event-card[open] { box-shadow: none; border: 1px solid #c9bda8; background: #fff; }
      .event-summary { padding: 4mm; grid-template-columns: 2mm minmax(0, 1fr) auto; }
      .kind-mark { width: 1.5mm; height: 10mm; }
      .event-title strong { font-size: 12pt; }
      .event-body { display: block !important; padding: 3mm 4mm 4mm 8mm; }
      .event:not(.has-evidence) .event-body { display: none !important; }
      .evidence-zone { margin-top: 0; padding-top: 0; border-top: 0; }
      .evidence-zone-head { margin-bottom: 3mm; }
      .evidence-zone-head h3 { font-size: 10pt; }
      .evidence-list { grid-template-columns: 1fr; gap: 5mm; }
      .evidence-item { break-inside: avoid; }
      .evidence-image-wrap { min-height: 0; max-height: none; aspect-ratio: auto; border: 1px solid #d4c9b6; overflow: visible; }
      .evidence-image-wrap a { height: auto; }
      .evidence-image-wrap img { height: auto; min-height: 0; max-height: 230mm; object-fit: contain; }
      .evidence-caption .field { border: 0; padding: 1mm 0 0; margin: 0; background: transparent; font-size: 9pt; }
      .empty-evidence { color: #777; font-style: italic; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <h1 id="displayTitle">工程款項與往來證據時間軸</h1>
      <p class="subtitle">依日期整理款項流向、對話紀錄與相關證據。點開任一事件即可附加多張截圖。</p>
    </header>

    <nav class="toolbar" aria-label="文件操作">
      <div class="toolbar-group">
        <button class="btn btn-primary" id="printButton" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
          生成完整 PDF
        </button>
        <button class="btn" id="addButton" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          新增事件
        </button>
      </div>
      <div class="privacy-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        資料只存在這台裝置
      </div>
    </nav>

    <main>
      <aside class="mobile-help">
        <strong>手機操作方式</strong>
        點開事件 → 上傳一張或多張截圖 → 最下方按「生成完整 PDF」。若 Telegram 內無法輸出，請用右上角選單改以 Safari 或 Chrome 開啟。
      </aside>

      <section class="document-settings" aria-label="文件設定">
        <label>文件標題
          <input class="field" id="titleInput" value="工程款項與往來證據時間軸">
        </label>
        <label>年份
          <input class="field" id="yearInput" placeholder="例如：2026 或民國115年">
        </label>
      </section>

      <div class="print-only print-meta" id="printMeta"></div>

      <section class="summary" aria-label="時間軸摘要">
        <div class="summary-item"><span class="summary-value" id="eventTotal">0</span><span class="summary-label">事件總數</span></div>
        <div class="summary-item"><span class="summary-value" id="evidenceTotal">0</span><span class="summary-label">已附證據</span></div>
        <div class="summary-item"><span class="summary-value" id="moneyTotal">0</span><span class="summary-label">含金額事件</span></div>
        <div class="summary-item"><span class="summary-value" id="missingTotal">0</span><span class="summary-label">尚未附證據</span></div>
      </section>

      <section>
        <div class="section-heading">
          <h2>事件時間線</h2>
          <p>點選事件展開編輯與上傳區</p>
        </div>
        <div class="timeline" id="timeline"></div>
      </section>
    </main>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

      { id: '0708-deposit', date: '07/08', time: '14:05', actor: 'COCO', kind: 'deposit', description: '存入 14.5 萬元', amount: '145,000' },
      { id: '0716-deposit', date: '07/16', time: '14:58', actor: 'COCO', kind: 'deposit', description: '存入 27.5 萬元', amount: '275,000' },
      { id: '0716-transfer', date: '07/16', time: '19:39', actor: '工程行', kind: 'transfer', description: '元大轉帳至工程行郵局帳戶兩筆：5 萬元＋5 萬元', amount: '100,000' },
      { id: '0716-line', date: '07/16', time: '19:42–20:06', actor: '工程行', kind: 'conversation', description: 'LINE 對話', amount: '' },
      { id: '0716-atm', date: '07/16', time: '20:03', actor: '工程行', kind: 'withdrawal', description: 'ATM 提領 10 萬元', amount: '100,000' },
      { id: '0716-rebate', date: '07/16', time: '未註明', actor: '工程行', kind: 'rebate', description: '給我回扣 1 萬 7,500 元（LINE 記事本截圖）', amount: '17,500' },
      { id: '0717-atm', date: '07/17', time: '16:27', actor: '工程行', kind: 'withdrawal', description: 'ATM 提領 9.2 萬元', amount: '92,000' },
      { id: '0720-call', date: '07/20', time: '19:54', actor: '工程行', kind: 'conversation', description: 'LINE 通話', amount: '' },
      { id: '0723-call', date: '07/23', time: '12:22–12:56', actor: '工程行', kind: 'conversation', description: 'LIME 通話（依原始提供文字）', amount: '' },
      { id: '0729-transfer', date: '07/29', time: '16:20', actor: '工程行', kind: 'transfer', description: '元大轉帳至工程行郵局帳戶，海邊路 5 萬元', amount: '50,000' },
      { id: '0730-cash', date: '07/30', time: '11:27', actor: '工程行', kind: 'cash', description: '給現金 4,000 元', amount: '4,000' }
    ];

    const KIND_LABELS = {
      deposit: '存入', withdrawal: '提領', transfer: '轉帳', conversation: '對話／通話',
      rebate: '回扣', adjustment: '待扣款', cash: '現金'
    };

    const timeline = document.querySelector('#timeline');
    const statusBox = document.querySelector('#status');
    const titleInput = document.querySelector('#titleInput');
    const yearInput = document.querySelector('#yearInput');
    let events = loadEvents();
    let db;
    let evidenceByEvent = new Map();
    let objectUrls = [];

    function loadEvents() {
      try {
        const saved = JSON.parse(localStorage.getItem('evidenceTimelineEvents'));
        return Array.isArray(saved) && saved.length ? saved : structuredClone(DEFAULT_EVENTS);
      } catch {
        return structuredClone(DEFAULT_EVENTS);
      }
    }

    function saveEvents() {
      localStorage.setItem('evidenceTimelineEvents', JSON.stringify(events));
      updateSummary();
    }

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    }

    function announce(message) {
      statusBox.textContent = message;
      statusBox.classList.add('show');
      clearTimeout(announce.timer);
      announce.timer = setTimeout(() => statusBox.classList.remove('show'), 1800);
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('evidenceTimelineDatabase', 1);
        request.onupgradeneeded = () => {
          const store = request.result.createObjectStore('evidence', { keyPath: 'id', autoIncrement: true });
          store.createIndex('eventId', 'eventId');
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function getAllEvidence() {
      return new Promise((resolve, reject) => {
        const request = db.transaction('evidence').objectStore('evidence').getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function putEvidence(record) {
      return new Promise((resolve, reject) => {
        const request = db.transaction('evidence', 'readwrite').objectStore('evidence').put(record);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function deleteEvidence(id) {
      return new Promise((resolve, reject) => {
        const request = db.transaction('evidence', 'readwrite').objectStore('evidence').delete(id);
        request.onsuccess = resolve;
        request.onerror = () => reject(request.error);
      });
    }

    async function refreshEvidence() {
      objectUrls.forEach(URL.revokeObjectURL);
      objectUrls = [];
      evidenceByEvent = new Map();
      for (const record of await getAllEvidence()) {
        if (!evidenceByEvent.has(record.eventId)) evidenceByEvent.set(record.eventId, []);
        evidenceByEvent.get(record.eventId).push(record);
      }
      render();
    }

    function evidenceMarkup(eventId) {
      const records = evidenceByEvent.get(eventId) || [];
      if (!records.length) return '<p class="empty-evidence">尚未附加證據截圖</p>';
      return records.map((record, index) => {
        const url = URL.createObjectURL(record.blob);
        objectUrls.push(url);
        return `
          <figure class="evidence-item">
            <div class="evidence-image-wrap">
              <a href="${url}" target="_blank" rel="noopener" title="開啟原尺寸圖片"><img src="${url}" alt="證據截圖 ${index + 1}"></a>
              <button class="evidence-remove" type="button" data-remove-evidence="${record.id}" aria-label="刪除這張證據"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 10v6M14 10v6"/></svg></button>
            </div>
            <label class="evidence-caption">證據說明
              <input class="field" data-evidence-caption="${record.id}" value="${escapeHtml(record.caption || '')}" placeholder="例如：存款明細截圖">
            </label>
          </figure>`;
      }).join('');
    }

    function render() {
      timeline.innerHTML = events.map(event => {
        const count = (evidenceByEvent.get(event.id) || []).length;
        return `
          <article class="event${count ? ' has-evidence' : ''}" data-kind="${escapeHtml(event.kind)}" data-event-id="${escapeHtml(event.id)}">
            <div class="event-date"><strong>${escapeHtml(event.date)}</strong><span>${escapeHtml(event.time)}</span></div>
            <details class="event-card">
              <summary class="event-summary">
                <span class="kind-mark" aria-hidden="true"></span>
                <span class="event-title"><strong>${escapeHtml(event.description)}</strong><span class="event-meta">${escapeHtml(event.actor)} · ${escapeHtml(KIND_LABELS[event.kind] || '其他')}${event.amount ? ` · ${escapeHtml(event.amount)} 元` : ''}</span></span>
                <span class="evidence-count">${count ? `已附 ${count} 張` : '尚無附件'}</span>
              </summary>
              <div class="event-body">
                <div class="edit-grid">
                  <label>日期<input class="field" data-field="date" value="${escapeHtml(event.date)}"></label>
                  <label>時間<input class="field" data-field="time" value="${escapeHtml(event.time)}"></label>
                  <label>對象<input class="field" data-field="actor" value="${escapeHtml(event.actor)}"></label>
                  <label>類型
                    <select class="field" data-field="kind">${Object.entries(KIND_LABELS).map(([value, label]) => `<option value="${value}" ${event.kind === value ? 'selected' : ''}>${label}</option>`).join('')}</select>
                  </label>
                  <label>金額<input class="field" data-field="amount" value="${escapeHtml(event.amount)}" placeholder="可留白"></label>
                  <label class="wide">事件說明<textarea class="field" data-field="description">${escapeHtml(event.description)}</textarea></label>
                </div>
                <div class="evidence-zone">
                  <div class="evidence-zone-head">
                    <h3>證據附件</h3>
                    <label class="btn upload-label" for="upload-${escapeHtml(event.id)}" role="button" tabindex="0">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
                      上傳多張截圖
                    </label>
                    <input class="file-input" id="upload-${escapeHtml(event.id)}" data-upload="${escapeHtml(event.id)}" type="file" accept="image/*" multiple>
                  </div>
                  <div class="evidence-list">${evidenceMarkup(event.id)}</div>
                </div>
              </div>
            </details>
          </article>`;
      }).join('');
      updateSummary();
    }

    function updateSummary() {
      const evidenceCount = [...evidenceByEvent.values()].reduce((total, records) => total + records.length, 0);
      const coveredEvents = [...evidenceByEvent.values()].filter(records => records.length).length;
      document.querySelector('#eventTotal').textContent = events.length;
      document.querySelector('#evidenceTotal').textContent = `${evidenceCount} 張`;
      document.querySelector('#moneyTotal').textContent = events.filter(event => event.amount).length;
      document.querySelector('#missingTotal').textContent = events.length - coveredEvents;
    }

    function sortEvents() {
      events.sort((a, b) => {
        const dateA = /^\d{2}\/\d{2}$/.test(a.date) ? a.date : '99/99';
        const dateB = /^\d{2}\/\d{2}$/.test(b.date) ? b.date : '99/99';
        const timeA = a.id === '0603-deposit' ? '00:00' : /^\d{2}:\d{2}/.test(a.time) ? a.time.slice(0, 5) : '99:99';
        const timeB = b.id === '0603-deposit' ? '00:00' : /^\d{2}:\d{2}/.test(b.time) ? b.time.slice(0, 5) : '99:99';
        return `${dateA} ${timeA}`.localeCompare(`${dateB} ${timeB}`);
      });
    }

    sortEvents();

    timeline.addEventListener('change', async event => {
      const field = event.target.dataset.field;
      if (field) {
        const eventId = event.target.closest('[data-event-id]').dataset.eventId;
        const item = events.find(entry => entry.id === eventId);
        item[field] = event.target.value.trim();
        if (field === 'date' || field === 'time') sortEvents();
        saveEvents();
        render();
        document.querySelector(`[data-event-id="${CSS.escape(eventId)}"] details`).open = true;
        announce('事件內容已儲存');
        return;
      }

      const evidenceId = Number(event.target.dataset.evidenceCaption);
      if (evidenceId) {
        const records = await getAllEvidence();
        const record = records.find(entry => entry.id === evidenceId);
        if (record) {
          record.caption = event.target.value.trim();
          await putEvidence(record);
          announce('證據說明已儲存');
        }
        return;
      }

      const eventId = event.target.dataset.upload;
      if (eventId) {
        const files = [...event.target.files].filter(file => file.type.startsWith('image/'));
        if (!files.length) return announce('請選擇圖片檔案');
        for (const file of files) {
          await putEvidence({ eventId, name: file.name, type: file.type, blob: file, caption: '', createdAt: Date.now() });
        }
        await refreshEvidence();
        document.querySelector(`[data-event-id="${CSS.escape(eventId)}"] details`).open = true;
        announce(`已加入 ${files.length} 張證據`);
      }
    });

    timeline.addEventListener('click', async event => {
      const button = event.target.closest('[data-remove-evidence]');
      if (!button) return;
      if (!confirm('確定要刪除這張證據嗎？')) return;
      const eventId = button.closest('[data-event-id]').dataset.eventId;
      await deleteEvidence(Number(button.dataset.removeEvidence));
      await refreshEvidence();
      document.querySelector(`[data-event-id="${CSS.escape(eventId)}"] details`).open = true;
      announce('證據已刪除');
    });

    timeline.addEventListener('keydown', event => {
      const label = event.target.closest('.upload-label');
      if (!label || !['Enter', ' '].includes(event.key)) return;
      event.preventDefault();
      document.getElementById(label.htmlFor).click();
    });

    document.querySelector('#addButton').addEventListener('click', () => {
      const id = `custom-${Date.now()}`;
      events.push({ id, date: 'MM/DD', time: '未註明', actor: '工程行', kind: 'conversation', description: '新增事件', amount: '' });
      saveEvents();
      render();
      const added = document.querySelector(`[data-event-id="${CSS.escape(id)}"]`);
      added.querySelector('details').open = true;
      added.scrollIntoView({ behavior: 'smooth', block: 'center' });
      announce('已新增事件');
    });

    const savedMeta = JSON.parse(localStorage.getItem('evidenceTimelineMeta') || '{}');
    titleInput.value = savedMeta.title || titleInput.value;
    yearInput.value = savedMeta.year || '';
    document.querySelector('#displayTitle').textContent = titleInput.value;

    function saveMeta() {
      const meta = { title: titleInput.value.trim() || '證據時間軸', year: yearInput.value.trim() };
      localStorage.setItem('evidenceTimelineMeta', JSON.stringify(meta));
      document.querySelector('#displayTitle').textContent = meta.title;
    }

    titleInput.addEventListener('input', saveMeta);
    yearInput.addEventListener('input', saveMeta);

    let previouslyOpen = [];
    window.addEventListener('beforeprint', () => {
      previouslyOpen = [...document.querySelectorAll('.event-card')].map(details => details.open);
      document.querySelectorAll('.event-card').forEach(details => { details.open = true; });
      const year = yearInput.value.trim();
      const generated = new Intl.DateTimeFormat('zh-TW', { dateStyle: 'long' }).format(new Date());
      document.querySelector('#printMeta').textContent = `${year ? `年份：${year}　｜　` : ''}製表日期：${generated}`;
    });

    window.addEventListener('afterprint', () => {
      document.querySelectorAll('.event-card').forEach((details, index) => { details.open = previouslyOpen[index]; });
    });

    document.querySelector('#printButton').addEventListener('click', () => window.print());

    render();

    (async () => {
      try {
        db = await openDatabase();
        await refreshEvidence();
      } catch (error) {
        render();
        announce('此瀏覽器無法儲存圖片，請改用 Chrome 或 Edge');
      }
    })();
  </script>
</body>
</html>
